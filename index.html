<script>
// Simple publication data — edit this array with your entries
const pubs = [
{
title: "Intent‑Hiding Attacks and Provably Optimal Targeted Defense",
authors: ["Jason", "Coauthor A", "Coauthor B"],
venue: "Preprint 2025",
links: { paper: "https://arxiv.org/abs/2505.20841", code: "https://github.com/yourrepo" },
img: "https://picsum.photos/seed/ihg/160/160",
selected: true
},
{
title: "Meta‑Agent for IT/SRE Tasks: Workflow & Toolsmith Optimizer",
authors: ["Jason", "Coauthor C"],
venue: "Workshop 2025",
links: { paper: "#", code: "#" },
img: "https://picsum.photos/seed/meta/160/160",
selected: true
},
{
title: "LLM Hidden Mechanisms: Interventions & Monitoring",
authors: ["Jason"],
venue: "Under Review",
links: { paper: "#" },
img: "https://picsum.photos/seed/mech/160/160",
selected: false
}
];


const pubList = document.getElementById('pub-list');
const filterBtns = document.querySelectorAll('[data-filter]');


function render(filter = 'selected') {
pubList.innerHTML = '';
const list = pubs.filter(p => filter === 'all' ? true : p.selected);
for (const p of list) {
const el = document.createElement('article');
el.className = 'card pub';
el.innerHTML = `
<img alt="thumbnail" src="${p.img}"/>
<div>
<h3>${p.title}</h3>
<div class="venue muted">${p.venue}</div>
<div class="muted" style="margin:4px 0 8px">${p.authors.join(', ')}</div>
<div class="row">
${p.links.paper ? `<a class="btn" href="${p.links.paper}" target="_blank" rel="noopener">Paper</a>` : ''}
${p.links.code ? `<a class="btn" href="${p.links.code}" target="_blank" rel="noopener">Code</a>` : ''}
${p.links.poster ? `<a class="btn" href="${p.links.poster}" target="_blank" rel="noopener">Poster</a>` : ''}
${p.links.slides ? `<a class="btn" href="${p.links.slides}" target="_blank" rel="noopener">Slides</a>` : ''}
</div>
</div>`;
pubList.appendChild(el);
}
filterBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.filter === filter));
}


filterBtns.forEach(btn => btn.addEventListener('click', () => render(btn.dataset.filter)));
render('selected');


// Footer helpers
document.getElementById('year').textContent = new Date().getFullYear();
document.getElementById('last-updated').textContent = new Date().toLocaleDateString();
</script>
</body>
</html>
